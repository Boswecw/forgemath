name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned ForgeLineage SDK
        uses: actions/checkout@v4
        with:
          repository: Boswell-Digital-Solutions/forge_lineage
          ref: 6b478392f48e2de11515d5b3cd23862d56284fdd
          path: .ci/forge_lineage

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify migrations apply (schema build surface)
        env:
          FORGEMATH_DATABASE_URL: sqlite:///./ci_migrations.db
        run: alembic upgrade head

      - name: Run tests
        env:
          PYTHONPATH: .ci/forge_lineage/sdk
        run: python -m pytest tests -q
